spring:
  application:
    name: ecole-saas-backend
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC

app:
  security:
    jwt:
      # Clé HMAC HS256 encodée en Base64, au moins 256 bits. Démarrage refusé sinon.
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:ecole-saas}
    mfa:
      # Clé AES-256 encodée en Base64 (32 octets) pour chiffrer les secrets TOTP.
      encryption-key: ${APP_MFA_ENCRYPTION_KEY:}
    cookie:
      refresh-name: ecole_refresh_token
      secure: ${APP_COOKIE_SECURE:true}
      same-site: Strict
      path: /api/v1/auth
    csrf:
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
