server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

spring:
  application:
    name: ecole-saas-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  transaction:
    default-timeout: 30
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
      validation-timeout: 2500
      max-lifetime: 1800000
      data-source-properties:
        options: "-c statement_timeout=15000 -c lock_timeout=5000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC

app:
  security:
    jwt:
      # Clé HMAC HS256 encodée en Base64, au moins 256 bits. Démarrage refusé sinon.
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:ecole-saas}
    mfa:
      # Clé AES-256 encodée en Base64 (32 octets) pour chiffrer les secrets TOTP.
      encryption-key: ${APP_MFA_ENCRYPTION_KEY:}
    cookie:
      refresh-name: ecole_refresh_token
      secure: ${APP_COOKIE_SECURE:true}
      same-site: Strict
      path: /api/v1/auth
    csrf:
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  communication:
    gateways:
      sms:
        unit-cost-xof: ${APP_COMM_SMS_UNIT_COST_XOF:25}
        provider-name: ${APP_COMM_SMS_PROVIDER:LOCAL_STUB_SMS}
      whatsapp:
        unit-cost-xof: ${APP_COMM_WHATSAPP_UNIT_COST_XOF:15}
        provider-name: ${APP_COMM_WHATSAPP_PROVIDER:LOCAL_STUB_WHATSAPP}
      email:
        unit-cost-xof: ${APP_COMM_EMAIL_UNIT_COST_XOF:0}
        provider-name: ${APP_COMM_EMAIL_PROVIDER:LOCAL_STUB_EMAIL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
