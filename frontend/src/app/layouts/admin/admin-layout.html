<div class="drawer lg:drawer-open min-h-screen bg-base-200">
  <input
    id="admin-nav-drawer"
    type="checkbox"
    class="drawer-toggle"
    [checked]="drawerOpen()"
    (change)="toggleDrawer()"
  />

  <div class="drawer-content flex min-w-0 flex-col">
    <header class="navbar sticky top-0 z-20 border-b border-base-300 bg-base-100 px-3 sm:px-6">
      <div class="flex flex-1 items-center gap-2">
        <button
          type="button"
          class="btn btn-ghost btn-square lg:hidden"
          aria-label="Ouvrir le menu de navigation"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="drawerOpen()"
          (click)="toggleDrawer()"
        >
          <svg lucideMenu class="h-5 w-5"></svg>
        </button>
        <span class="truncate text-base font-semibold text-base-content">
          {{ authService.user()?.tenantName ?? 'École SaaS' }}
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="btn btn-ghost btn-sm gap-2"
          [attr.aria-pressed]="themeService.isDark()"
          (click)="themeService.toggleTheme()"
        >
          @if (themeService.isDark()) {
            <svg lucideSun class="h-4 w-4"></svg>
            <span class="hidden sm:inline">Mode clair</span>
          } @else {
            <svg lucideMoon class="h-4 w-4"></svg>
            <span class="hidden sm:inline">Mode sombre</span>
          }
        </button>

        @if (authService.user(); as user) {
          <span class="badge badge-outline hidden md:inline-flex">{{ user.fullName }}</span>
        }

        <button
          type="button"
          class="btn btn-ghost btn-sm gap-1"
          aria-label="Se déconnecter"
          (click)="logout()"
        >
          <svg lucideLogOut class="h-4 w-4"></svg>
          <span class="hidden sm:inline">Déconnexion</span>
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>

  <div class="drawer-side z-30">
    <label
      for="admin-nav-drawer"
      aria-label="Fermer le menu"
      class="drawer-overlay"
      (click)="closeDrawer()"
    ></label>

    <aside
      id="admin-sidebar"
      aria-label="Navigation principale"
      class="flex min-h-full w-64 flex-col border-r border-base-300 bg-base-100 text-base-content"
    >
      <div class="flex items-center justify-between border-b border-base-300 px-4 py-4">
        <span class="text-lg font-bold text-primary">École SaaS</span>
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square lg:hidden"
          aria-label="Fermer le menu de navigation"
          (click)="closeDrawer()"
        >
          <svg lucideX class="h-4 w-4"></svg>
        </button>
      </div>

      <nav class="menu flex-1 gap-1 p-3">
        <a
          routerLink="/dashboard"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideLayoutDashboard class="h-4 w-4"></svg>
          Tableau de bord
        </a>
        <a
          routerLink="/students"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideUsers class="h-4 w-4"></svg>
          Élèves
        </a>
        <a
          routerLink="/grades"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideGraduationCap class="h-4 w-4"></svg>
          Notes et bulletins
        </a>
        <a
          routerLink="/attendance"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideCalendarCheck class="h-4 w-4"></svg>
          Absences
        </a>
        <a
          routerLink="/finance"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideWallet class="h-4 w-4"></svg>
          Finances
        </a>
        <a
          routerLink="/import"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideUpload class="h-4 w-4"></svg>
          Import Excel
        </a>
        <a
          routerLink="/settings"
          routerLinkActive="menu-active"
          (click)="closeDrawer()"
        >
          <svg lucideSettings class="h-4 w-4"></svg>
          Paramètres
        </a>
      </nav>
    </aside>
  </div>
</div>
